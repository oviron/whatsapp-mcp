name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
      - name: Build, vet, test
        working-directory: whatsapp-bridge
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
          go build -tags sqlite_fts5 -o /tmp/wb .
          go vet -tags sqlite_fts5 ./...
          go test -tags sqlite_fts5 ./...
          go test ./...

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # apt mirrors stall for minutes at a time; the static build comes from GitHub's own CDN.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for attempt in 1 2 3; do
            curl -fsSL --max-time 180 "$url" | tar -xJ -C "$RUNNER_TEMP" --strip-components=2 \
              ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe && break
            echo "ffmpeg download attempt $attempt failed"
            [ "$attempt" = 3 ] && exit 1
            sleep 20 # BtbN replaces the "latest" release for at least 15 s during each publish
          done
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Unit tests
        working-directory: whatsapp-mcp-server
        run: uv run python -m unittest discover -p 'test_*.py'
